  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Container for Header & Controls */
    .container {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #a0a0ab;
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 24px;
    }

    /* Console Log Display */
    .console-box {
      width: 100%;
      height: 260px;
      background-color: #16161c;
      border: 1px solid #282832;
      border-radius: 12px;
      padding: 16px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: #35d499;
      text-align: left;
      overflow-y: auto;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }

    .log-line {
      margin: 4px 0;
      line-height: 1.4;
      word-break: break-all;
    }

    .log-line.error { color: #ff5555; }
    .log-line.system { color: #a0a0ab; }
    .log-line.success { color: #50fa7b; font-weight: bold; }

    /* Action Button */
    .btn-jailbreak {
      width: 100%;
      max-width: 320px;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(180deg, #007aff 0%, #0056b3 100%);
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-jailbreak:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-jailbreak:disabled {
      background: #33333a;
      color: #777780;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Fake Notification Modal */
    .notification-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .notification-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .alert-box {
      width: 270px;
      background: rgba(30, 30, 30, 0.9);
      border-radius: 14px;
      text-align: center;
      color: white;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .alert-content {
      padding: 20px;
    }

    .alert-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .alert-desc {
      font-size: 0.85rem;
      color: #d0d0d0;
      line-height: 1.3;
    }

    .alert-actions {
      border-top: 0.5px solid rgba(255, 255, 255, 0.2);
      display: flex;
    }

    .alert-button {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: #0a84ff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* PWA Prompt Banner */
    .pwa-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1c1c1e;
      border: 1px solid #38383a;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 0.85rem;
      color: #cccccc;
      z-index: 999;
    }

    .pwa-banner span {
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Jailbrik Na</h1>
    <p class="subtitle">iOS 15.0 - 17.5.1 Jailbreak made by AMIRHACKS</p>

    <!-- Terminal Output Box -->
    <div class="console-box" id="console">
      <div class="log-line system">[i] Device connected: iPhone (arm64e)</div>
      <div class="log-line system">[i] Ready to initialize...</div>

    <!-- Main Action Button -->
    <button class="btn-jailbreak" id="actionBtn" onclick="startJailbreak()">Jailbreak</button>
  </div>

  <!-- iOS System Alert -->
  <div class="notification-overlay" id="alertModal">
    <div class="alert-box">
      <div class="alert-content">
        <div class="alert-title">Jailbreak Complete</div>
        <div class="alert-desc">Your phone is jailbroken! Cydia has been staged for your Home Screen.</div>

      <div class="alert-actions">
        <button class="alert-button" onclick="closeAlert()">Open Cydia</button>

    </div>
  </div>

  <!-- Add to Home Screen Instructions Banner -->
  <div class="pwa-banner" id="pwaBanner">
    To complete Cydia installation: Tap <span>Share</span> <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" style="display:inline; vertical-align:middle;"><path d="M6 0L1 5h3.5v6h3V5H11L6 0zM0 14h12v2H0v-2z"/></svg> then select <span>'Add to Home Screen'</span>.
  </div>

  <script>
    // Sequence of log lines with delays (in milliseconds) simulating 2-3 minutes total runtime (~140 seconds)
    const logs = [
      { text: "[*] Initializing environment...", delay: 2000 },
      { text: "[*] Validating system parameters...", delay: 4000 },
      { text: "[*] Reading kernel memory struct...", delay: 6000 },
      { text: "[*] Locating kernel base offset...", delay: 8000 },
      { text: "[+] Found Kernel Base: 0xfffffff007004000", delay: 10000 },
      { text: "[*] Running exploit strategy (1/4)...", delay: 12000 },
      { text: "[*] Bypassing PAC (Pointer Authentication Code)...", delay: 18000 },
      { text: "[*] Escalating task port privileges...", delay: 25000 },
      { text: "[+] Obtained tfp0 master port: 0x103", delay: 32000 },
      { text: "[*] Patching AMFI (Apple Mobile File Integrity)...", delay: 40000 },
      { text: "[*] Disabling Sandbox restrictions...", delay: 48000 },
      { text: "[*] Running exploit strategy (2/4)...", delay: 55000 },
      { text: "[*] Disabling hardware watchdog timer...", delay: 65000 },
      { text: "[*] Unmounting root filesystem...", delay: 75000 },
      { text: "[*] Remounting / writeable...", delay: 85000 },
      { text: "[+] RootFS remounted successfully.", delay: 92000 },
      { text: "[*] Running exploit strategy (3/4)...", delay: 100000 },
      { text: "[*] Extracting Cydia package payload...", delay: 108000 },
      { text: "[*] Installing bootstrap dependencies...", delay: 116000 },
      { text: "[*] Injecting dyld shared cache patches...", delay: 124000 },
      { text: "[*] Running exploit strategy (4/4)...", delay: 130000 },
      { text: "[*] Rebuilding launch daemon cache...", delay: 136000 },
      { text: "[+] Exploitation clean & successful!", delay: 140000, style: "success" },
      { text: "[*] Finalizing installation...", delay: 142000 }
    ];

    const consoleBox = document.getElementById("console");
    const actionBtn = document.getElementById("actionBtn");
    const alertModal = document.getElementById("alertModal");
    const pwaBanner = document.getElementById("pwaBanner");

    function logMessage(text, className = "") {
      const line = document.createElement("div");
      line.className = `log-line ${className}`;
      line.textContent = text;
      consoleBox.appendChild(line);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function startJailbreak() {
      actionBtn.disabled = true;
      actionBtn.textContent = "Jailbreaking...";
      logMessage("[*] Starting jailbreak process...", "system");

      logs.forEach((item) => {
        setTimeout(() => {
          logMessage(item.text, item.style || "");
        }, item.delay);
      });

      // Show completion after final log finishes (~145s)
      setTimeout(() => {
        finishJailbreak();
      }, 145000);
    }

    function finishJailbreak() {
      actionBtn.textContent = "Jailbroken";
      
      // Native system notification request (if supported)
      if ("Notification" in window && Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            new Notification("Jailbrik Complete", {
              body: "Your phone is jailbroken! Cydia is ready.",
              icon: "data:image/svg+xml;utf8,<svg xmlns='[w3.org](http://www.w3.org/2000/svg)' width='180' height='180' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23631919'/><text x='90' y='105' font-family='sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>"
            });
          }
        });
      }

      // Show iOS Alert Modal
      alertModal.classList.add("visible");
    }

    function closeAlert() {
      alertModal.classList.remove("visible");
      // Prompt user to add icon to home screen
      pwaBanner.style.display = "block";
    }
  </script>

</html>
